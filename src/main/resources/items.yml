# BetterItems - Spigot 1.12.2
# Abilities available: COMMAND, LIGHTNING, LIGHTNING_DAMAGE, HEAL, FEED, SATURATION,
# SPEED, SLOWNESS, JUMP, STRENGTH, RESISTANCE, FIRE_RESISTANCE, WATER_BREATHING,
# NIGHT_VISION, INVISIBILITY, REGENERATION, ABSORPTION, DAMAGE, KNOCKBACK, LAUNCH,
# TELEPORT_FORWARD, EXPLOSION_EFFECT, FIREBALL, SNOWBALL, ENDER_PEARL, ARROW, POISON,
# WITHER, BLINDNESS, WEAKNESS, SLOW_TARGET, POTION_ON_HIT, FIRE_TARGET, EXTINGUISH,
